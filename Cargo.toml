[package]
name = "carteira-investimentos"
version = "0.1.0"
edition = "2021"
authors = ["Felipe Andrew <felipeandrewpro@gmail.com>"]
description = "Carteira de Investimentos Fullstack desenvolvida em Rust com Axum, SQLx, PostgreSQL, JWT e Askama."

[dependencies]
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }
dotenvy = "0.15"
jsonwebtoken = "9.3"
argon2 = { version = "0.5", features = ["std"] }
askama = "0.12"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
